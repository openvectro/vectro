name: Desktop

# Builds the Vectro desktop app for macOS, Linux and Windows when a version tag is pushed, and
# uploads the installers, the signed updater artifacts and latest.json to a draft GitHub Release.
# Publishing the draft is what makes running copies see the update. See desktop/README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            targets: wasm32-unknown-unknown
            args: ""
          - name: Windows
            os: windows-latest
            targets: wasm32-unknown-unknown
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            editor/package-lock.json
            desktop/package-lock.json

      - name: Install editor dependencies
        working-directory: editor
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # beforeBuildCommand in desktop/src-tauri/tauri.conf.json builds the wasm and the editor.
      - name: Build and upload to a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Vectro ${{ github.ref_name }}"
          releaseBody: "Desktop builds for macOS, Linux and Windows. Installed copies update themselves once this release is published."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
